name: Package Release

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: "Release tag to publish, for example v0.2.0. Leave empty to build artifacts only."
                required: false
                type: string
    push:
        branches: [main]
        tags: ["v*"]
        paths:
            - "apps/core/**"
            - "apps/electron/**"
            - "packages/extension/**"
            - "scripts/generateLazyPack.ts"
            - "scripts/lazyPackExtensions.ts"
            - ".github/workflows/lazy-package.yml"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"

permissions:
    contents: write

env:
    CSC_IDENTITY_AUTO_DISCOVERY: false
    RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
    package-linux:
        name: Build Package and Linux Executable
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 10
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 25
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build game package
              run: pnpm generatePackage

            - name: Upload game package artifact
              uses: actions/upload-artifact@v7
              with:
                  name: game-package
                  path: output/lazy-pack
                  retention-days: 30

            - name: Upload import package artifact
              uses: actions/upload-artifact@v7
              with:
                  name: import-package
                  path: output/import-package
                  retention-days: 30

            - name: Build Linux executable
              run: pnpm -F @noname/electron build:linux

            - name: Upload Linux executable artifact
              uses: actions/upload-artifact@v7
              with:
                  name: linux-executable
                  path: output/*.AppImage
                  retention-days: 30

            - name: Package import release asset
              if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
              run: |
                  cd output/import-package
                  zip -r "$GITHUB_WORKSPACE/noname-import-package.zip" .

            - name: Upload release asset
              if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "构建产物"
                  gh release upload "$RELEASE_TAG" noname-import-package.zip output/*.AppImage --clobber

    package-windows:
        name: Build Windows Executable
        needs: package-linux
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 10
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 25
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build game package
              run: pnpm generatePackage

            - name: Build Windows executable
              run: pnpm -F @noname/electron build:win

            - name: Upload Windows executable artifact
              uses: actions/upload-artifact@v7
              with:
                  name: windows-executable
                  path: output/*.exe
                  retention-days: 30

            - name: Upload release asset
              if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: pwsh
              run: |
                  foreach ($asset in Get-ChildItem output -Filter "*.exe") {
                      gh release upload "$env:RELEASE_TAG" $asset.FullName --clobber
                  }
