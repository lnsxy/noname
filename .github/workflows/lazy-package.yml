name: Package Lazy Pack

on:
    workflow_dispatch:
    push:
        branches: [main]
        tags: ["lazy-pack-v*"]
        paths:
            - "apps/core/**"
            - "apps/electron/**"
            - "packages/extension/**"
            - "scripts/generateLazyPack.ts"
            - "scripts/lazyPackExtensions.ts"
            - ".github/workflows/lazy-package.yml"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"

permissions:
    contents: write

env:
    CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
    package:
        name: Build and Package Lazy Pack
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 10
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 25
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build lazy pack
              run: pnpm generateLazyPack

            - name: Upload lazy pack artifact
              uses: actions/upload-artifact@v7
              with:
                  name: 懒人包
                  path: output/lazy-pack
                  retention-days: 30

            - name: Build Linux executable
              run: pnpm -F @noname/electron build:linux

            - name: Upload Linux executable artifact
              uses: actions/upload-artifact@v7
              with:
                  name: 懒人包-Linux
                  path: output/*.AppImage
                  retention-days: 30

            - name: Package release asset
              if: startsWith(github.ref, 'refs/tags/lazy-pack-v')
              run: |
                  cd output/lazy-pack
                  zip -r "$GITHUB_WORKSPACE/noname-lazy-pack.zip" .

            - name: Upload release asset
              if: startsWith(github.ref, 'refs/tags/lazy-pack-v')
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "无名杀懒人包构建产物"
                  gh release upload "$GITHUB_REF_NAME" noname-lazy-pack.zip --clobber
