name: Package New Standard Extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["new-standard-v*"]
    paths:
      - "packages/extension/new_standard/**"
      - ".github/workflows/new-standard-package.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: write

jobs:
  package:
    name: Build and Package new_standard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build new_standard
        run: pnpm -F @noname-extension/new_standard build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: new_standard
          path: apps/core/extension/new_standard/
          retention-days: 30

      - name: Package release asset
        if: startsWith(github.ref, 'refs/tags/new-standard-v')
        run: |
          cd apps/core/extension/new_standard
          zip -r "$GITHUB_WORKSPACE/new_standard.zip" .

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/new-standard-v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "新-标包扩展构建产物"
          gh release upload "$GITHUB_REF_NAME" new_standard.zip --clobber
